name: Suivi quotidien (config.yaml)

on:
  schedule:
    - cron: "17 6 * * *"  # 6 h 17 UTC : 8 h 17 à Paris l'été, 7 h 17 l'hiver (hors heure pile, moins chargée ; GitHub peut retarder de 10 à 30 min)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Générer l'e-mail sans l'envoyer (ni modifier l'historique)"
        type: boolean
        default: false
      diagnostic:
        description: "Afficher dans les logs la réponse brute de l'API Travelpayouts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Diagnostic Travelpayouts
        if: inputs.diagnostic
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python -m tracker.diagnose
      - name: Relevé, analyse et e-mail
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m tracker ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: E-mail généré (consultable même sans envoi)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email
          path: out/email.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit de l'historique
        if: always() && !inputs.dry_run
        run: |
          [ -d data ] || { echo "Aucun historique à commiter."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Relevé des prix du $(date -u +%F)"
          git pull --rebase  # main a pu avancer pendant le run (commit poussé entre-temps)
          git push
